services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # docker compose up -d to run without tunnel token
    # docker compose --profile production up -d to run with tunnel token
    profiles: ["production"]
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
