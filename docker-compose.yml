services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - segmentation-api
      - classification-api

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["production"]
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  segmentation-api:
    build: ./services/segmentation-api
    container_name: segmentation-api
    restart: always

  classification-api:
    build: ./services/classification-api
    container_name: classification-api
    restart: always