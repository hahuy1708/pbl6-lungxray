<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBL6 - Lung X-Ray AI System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 1.1rem; }
        .status {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #059669;
            color: #fff;
            border-radius: 20px;
            font-weight: bold;
        }
        .play-btn {
            display: block;
            margin: 1.5rem auto 0;
            padding: 0.6rem 1.4rem;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        .play-btn:hover { background-color: #0ea5e9; }
        .video-wrapper {
            margin-top: 1.5rem;
            display: none;
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* tỉ lệ 16:9 */
            height: 0;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-wrapper.show { display: block; }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>PBL6 - Lung X-Ray System</h1>
        <p>Hệ thống Phân đoạn & Phân loại X-quang Phổi</p>
        <div class="status">● Server Online (Cloudflare Tunnel)</div>

        <button class="play-btn" onclick="toggleVideo()">▶ Play Video</button>
        <div class="video-wrapper" id="videoWrapper">
            <iframe id="ytFrame" src=""
                title="YouTube video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function toggleVideo() {
            const wrapper = document.getElementById('videoWrapper');
            const frame = document.getElementById('ytFrame');
            if (wrapper.classList.contains('show')) {
                wrapper.classList.remove('show');
                frame.src = '';   // dừng phát khi ẩn video, tránh chạy ngầm
            } else {
                frame.src = 'https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1';
                wrapper.classList.add('show');
            }
        }
    </script>
</body>
</html>
