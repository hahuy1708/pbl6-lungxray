<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PBL6 - Phân tích X-quang phổi</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="page">
        <header>
            <p class="eyebrow">PBL6 · LUNGXRAY</p>
            <h1>Phân tích X-quang phổi</h1>
            <p class="intro">Tải ảnh X-quang lên để gửi tới dịch vụ segmentation trên server.</p>
        </header>

        <section class="card" aria-labelledby="upload-title">
            <h2 id="upload-title">Chọn ảnh để phân tích</h2>
            <form id="upload-form">
                <label class="file-picker" for="xray-file">
                    <span id="file-name">Chọn ảnh PNG hoặc JPEG (tối đa 20 MB)</span>
                    <input id="xray-file" name="file" type="file" accept="image/png,image/jpeg" required>
                </label>
                <img id="preview" class="preview" alt="Ảnh X-quang đã chọn" hidden>
                <button id="submit-button" type="submit">Phân tích ảnh</button>
            </form>
            <p id="status" class="status" role="status" aria-live="polite">Chưa gửi ảnh.</p>
        </section>

        <section id="result-section" class="card result" aria-labelledby="result-title" hidden>
            <h2 id="result-title">Phản hồi từ segmentation API</h2>
            <pre id="result" aria-live="polite"></pre>
        </section>
    </main>
    <script src="/app.js" defer></script>
</body>
</html>
